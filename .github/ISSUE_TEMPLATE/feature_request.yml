name: Feature request
description: Propose a focused analytical, workflow, or engineering improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What analyst or engineering problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful outcome.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Data and evidence boundary
      description: What sources, fields, provenance, or legal distinctions matter?
  - type: textarea
    id: risks
    attributes:
      label: Risks and limitations
      description: Note false-positive, false-negative, privacy, security, or governance concerns.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
